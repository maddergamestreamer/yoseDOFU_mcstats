<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔ Server Stats ⚔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0d1f0d;
  --bg2:       #162816;
  --bg3:       #1e3a1e;
  --panel:     #0a150a;
  --border:    #3a5c2a;
  --border2:   #5a8c3a;
  --green:     #5ab032;
  --lime:      #8dce44;
  --diamond:   #5bcefa;
  --gold:      #FFD700;
  --silver:    #b0c8c8;
  --bronze:    #cd7f32;
  --red:       #e85c3a;
  --text:      #e8f0d8;
  --muted:     #7a9a6a;
  --pixel: 4px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(255,255,255,0.015) 31px, rgba(255,255,255,0.015) 32px),
    repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(255,255,255,0.015) 31px, rgba(255,255,255,0.015) 32px);
  color: var(--text);
  font-family: 'VT323', monospace;
  font-size: 18px;
  min-height: 100vh;
  padding-bottom: 4rem;
}

/* ── HEADER ── */
header {
  background: var(--panel);
  border-bottom: 4px solid var(--border);
  padding: 1.5rem 1rem 1rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent 0px, transparent 16px,
    rgba(90,176,50,0.06) 16px, rgba(90,176,50,0.06) 17px
  );
  pointer-events: none;
}
.site-title {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(14px, 3vw, 22px);
  color: var(--gold);
  text-shadow: 3px 3px 0 #7a4e00, 6px 6px 0 rgba(0,0,0,0.5);
  letter-spacing: 2px;
  line-height: 1.6;
  position: relative;
}
.site-sub {
  font-family: 'VT323', monospace;
  font-size: 20px;
  color: var(--muted);
  margin-top: 8px;
}
.grass-strip {
  height: 12px;
  background: linear-gradient(to bottom, var(--lime) 0%, var(--lime) 50%, #8B5E3C 50%, #8B5E3C 100%);
  margin-top: 1rem;
  image-rendering: pixelated;
}

/* ── TABS ── */
.tab-section {
  max-width: 900px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
}
.tab-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--muted);
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tab-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 8px 12px;
  background: var(--bg3);
  border: 3px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.1s;
  image-rendering: pixelated;
  line-height: 1.4;
  text-align: center;
}
.tab-btn:hover {
  background: var(--bg2);
  border-color: var(--border2);
  color: var(--text);
  transform: translateY(-2px);
}
.tab-btn.active {
  background: var(--green);
  border-color: var(--lime);
  color: #fff;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  transform: translateY(-2px);
  box-shadow: 0 4px 0 #2a5a10;
}

/* ── RANKING PANEL ── */
.ranking-wrap {
  max-width: 900px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
}
.rank-header {
  background: var(--panel);
  border: 3px solid var(--border2);
  border-bottom: none;
  padding: 12px 16px 10px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.rank-title {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(9px, 1.8vw, 12px);
  color: var(--diamond);
  text-shadow: 2px 2px 0 rgba(0,100,150,0.4);
}
.rank-desc {
  font-size: 16px;
  color: var(--muted);
}
.rank-table-wrap {
  border: 3px solid var(--border2);
  background: var(--panel);
  overflow: hidden;
}
.rank-row {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 2px solid var(--bg3);
  gap: 10px;
  transition: background 0.1s;
  animation: rowIn 0.25s ease both;
}
.rank-row:last-child { border-bottom: none; }
.rank-row:hover { background: var(--bg3); }
@keyframes rowIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.rank-row:nth-child(1) { animation-delay: 0.00s; }
.rank-row:nth-child(2) { animation-delay: 0.04s; }
.rank-row:nth-child(3) { animation-delay: 0.08s; }
.rank-row:nth-child(n+4) { animation-delay: 0.12s; }

.rank-badge {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid;
  flex-shrink: 0;
}
.rank-badge.r1 { background: #3a2800; border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 8px rgba(255,200,0,0.2); }
.rank-badge.r2 { background: #1a2828; border-color: var(--silver); color: var(--silver); }
.rank-badge.r3 { background: #2a1608; border-color: var(--bronze); color: var(--bronze); }
.rank-badge.rN { background: var(--bg2); border-color: var(--border); color: var(--muted); font-size: 9px; }

.rank-info { min-width: 0; }
.rank-name {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(7px, 1.5vw, 10px);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-row.r1 .rank-name { color: var(--gold); }
.rank-row.r2 .rank-name { color: var(--silver); }
.rank-row.r3 .rank-name { color: var(--bronze); }

.rank-bar-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.rank-bar-bg {
  flex: 1;
  height: 8px;
  background: var(--bg);
  border: 2px solid var(--border);
  overflow: hidden;
}
.rank-bar-fill {
  height: 100%;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  image-rendering: pixelated;
}

.rank-val {
  font-family: 'VT323', monospace;
  font-size: 20px;
  white-space: nowrap;
  text-align: right;
  min-width: 100px;
  flex-shrink: 0;
}
.rank-row.r1 .rank-val { color: var(--gold); }
.rank-row.r2 .rank-val { color: var(--silver); }
.rank-row.r3 .rank-val { color: var(--bronze); }

/* ── FOOTER ── */
footer {
  text-align: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--muted);
  margin-top: 3rem;
  line-height: 2;
}
</style>
</head>

function buildTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c,i) =>

}

    const pct = Math.max(4, Math.round((p[cat.key] - minVal) / range * 100));
    const rankCls = i===0?'r1':i===1?'r2':i===2?'r3':'rN';
    const rankLbl = i===0?'1st':i===1?'2nd':i===2?'3rd':`${i+1}`;
    return `
<div class="rank-row ${rankCls}" style="animation-delay:${Math.min(i*0.04,0.2)}s">
  <div class="rank-badge ${rankCls}">${rankLbl}</div>
  <div class="rank-info">
    <div class="rank-name">${p.name}</div>
    <div class="rank-bar-wrap">
      <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
    </div>
  </div>
  <div class="rank-val">${cat.fmt(p[cat.key])}</div>
</div>`;
  }).join('');

  document.getElementById('rankTable').innerHTML = html;
}

window.switchCat = function(i) {
  current = i;
  document.querySelectorAll('.tab-btn').forEach((b,j) => b.classList.toggle('active', j===i));
  buildRanking();
};

buildTabs();
buildRanking();
</script>
</body>
</html>
