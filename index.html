/* ── Google Fonts: Press Start 2P (ピクセル) + Noto Serif JP (和文) ── */

:root {
  --bg:      #0d0b09;
  --panel:   #13100c;
  --border:  #3a2a18;
  --border2: #6a4a28;
  --gold:    #c8960a;
  --gold2:   #f0c040;
  --silver:  #9ab0b8;
  --bronze:  #a06030;
  --text:    #e8dcc8;
  --muted:   #8a7860;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(80,30,10,0.12) 0%, transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px);
  color: var(--text);
  font-family: 'Noto Serif JP', 'Yu Mincho', '游明朝', serif;
  font-size: 16px;
  min-height: 100vh;
  padding-bottom: 5rem;
}

/* 下部を暗くフェード */
.header-bg::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    rgba(0,0,0,0.1) 0%,
    rgba(0,0,0,0.2) 40%,
    rgba(13,11,9,0.95) 100%
  );
}
/* 和風格子オーバーレイ */
.header-grid {
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(90deg, transparent 0, transparent 59px, rgba(200,150,10,0.06) 59px, rgba(200,150,10,0.06) 60px),
    repeating-linear-gradient(0deg,  transparent 0, transparent 59px, rgba(200,150,10,0.06) 59px, rgba(200,150,10,0.06) 60px);
  pointer-events: none;
}
.header-content {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  z-index: 2;
}
.header-logo {
  width: min(280px, 55vw);
  height: min(280px, 55vw);
  object-fit: contain;
  filter: drop-shadow(0 4px 24px rgba(0,0,0,0.7));
  border-radius: 6px;
  margin-bottom: 10px;
}
.site-sub {
  font-family: 'Noto Serif JP', 'Yu Mincho', '游明朝', serif;
  font-size: clamp(25px, 1.4vw, 12px);
  color: var(--gold);
  letter-spacing: 0.25em;
  text-shadow: 0 0 16px rgba(200,150,10,0.6), 2px 2px 0 rgba(0,0,0,0.9);
  margin-top: 6px;
}
.header-divider {
  margin: 10px auto 0;
  width: 680px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  position: relative;
}
.header-divider::before, .header-divider::after {
  content: '◆';
  position: absolute;
  top: -7px;
  color: var(--gold);
  font-size: 9px;
}
.header-divider::before { left: 0; }
.header-divider::after  { right: 0; }

/* ── TABS ── */
.nav-section {
  max-width: 980px;
  margin: 2rem auto 0;
  padding: 0 1rem;
}
.nav-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.2em;
  margin-bottom: 12px;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.tab-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  padding: 9px 13px;
  background: var(--panel);
  border: 2px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  letter-spacing: 0.04em;
  line-height: 1.5;
  transition: all 0.15s;
  image-rendering: pixelated;
}
.tab-btn:hover {
  border-color: var(--border2);
  color: var(--text);
  transform: translateY(-2px);
  box-shadow: 0 3px 0 rgba(0,0,0,0.5);
}
.tab-btn.active {
  background: linear-gradient(135deg, #1a0f06, #2a1a0a);
  border-color: var(--gold);
  color: var(--gold2);
  transform: translateY(-2px);
  box-shadow: 0 3px 0 #7a4e00, 0 0 12px rgba(200,150,10,0.3);
}

/* ── RANKING ── */
.ranking-wrap {
  max-width: 980px;
  margin: 1.5rem auto 0;
  padding: 0 1rem;
}
.rank-header {
  background: linear-gradient(135deg, #150e06, #1e1508);
  border: 2px solid var(--border2);
  border-bottom: none;
  padding: 16px 22px 14px;
}
.rank-title {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(10px, 1.8vw, 14px);
  color: var(--gold2);
  letter-spacing: 0.08em;
  line-height: 1.6;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
}
.rank-desc {
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  color: var(--muted);
  margin-top: 4px;
  letter-spacing: 0.08em;
}
.rank-table-wrap {
  border: 2px solid var(--border2);
  border-top: none;
  background: var(--panel);
  overflow: hidden;
}
.rank-row {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  align-items: center;
  padding: 15px 22px;
  border-bottom: 1px solid rgba(58,42,24,0.6);
  gap: 14px;
  transition: background 0.15s;
  animation: rowIn 0.3s ease both;
  position: relative;
}
.rank-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.2s;
}
.rank-row:hover { background: rgba(200,150,10,0.05); }
.rank-row:hover::before { background: var(--border2); }
.rank-row:last-child { border-bottom: none; }
.rank-row.r1::before { background: var(--gold); }
.rank-row.r2::before { background: var(--silver); }
.rank-row.r3::before { background: var(--bronze); }

@keyframes rowIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}

.rank-badge {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  border: 2px solid;
  flex-shrink: 0;
  gap: 3px;
  image-rendering: pixelated;
}
.rank-badge.r1 { border-color: var(--gold);   color: var(--gold2); background: rgba(200,150,10,0.1); box-shadow: 0 0 10px rgba(200,150,10,0.25), inset 0 0 6px rgba(200,150,10,0.1); }
.rank-badge.r2 { border-color: var(--silver);  color: var(--silver); background: rgba(154,176,184,0.07); }
.rank-badge.r3 { border-color: var(--bronze);  color: var(--bronze); background: rgba(160,96,48,0.07); }
.rank-badge.rN { border-color: var(--border);  color: var(--muted);  background: transparent; }
.rank-badge .badge-num { font-size: 13px; line-height: 1; }
.rank-badge .badge-sub { font-size: 8px; opacity: 0.7; }

.rank-info { min-width: 0; }
.rank-name {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(9px, 1.6vw, 13px);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.04em;
  line-height: 1.4;
}
.rank-row.r1 .rank-name { color: var(--gold2); }
.rank-row.r2 .rank-name { color: var(--silver); }
.rank-row.r3 .rank-name { color: var(--bronze); }

.rank-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.rank-bar-bg {
  flex: 1;
  height: 6px;
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--border);
  overflow: hidden;
  image-rendering: pixelated;
}
.rank-bar-fill {
  height: 100%;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  image-rendering: pixelated;
}

.rank-val {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(11px, 1.6vw, 15px);
  white-space: nowrap;
  text-align: right;
  min-width: 110px;
  flex-shrink: 0;
  letter-spacing: 0.03em;
  line-height: 1.4;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.7);
}
.rank-row.r1 .rank-val { color: var(--gold2); }
.rank-row.r2 .rank-val { color: var(--silver); }
.rank-row.r3 .rank-val { color: var(--bronze); }

/* ── FOOTER ── */
footer {
  text-align: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--muted);
  margin-top: 4rem;
  letter-spacing: 0.2em;
  line-height: 2.5;
}
.footer-div {

const fmtTime = t => { const h = Math.floor(t/72000); return h.toLocaleString()+'h'; };
const fmtDist = v => v.toFixed(1)+' km';
const fmtNum  = v => v.toLocaleString();
const fmtEff  = v => v.toFixed(3);

const categories = [
  {key:'play_time',   label:'⏱ PLAY TIME',    title:'PLAY TIME',         desc:'総プレイ時間',            fmt:fmtTime, color:'#5b9cd4'},
  {key:'mob_kills',   label:'⚔ MOB KILLS',    title:'MOB KILLS',         desc:'討伐したMobの合計数',     fmt:fmtNum,  color:'#c84040'},
  {key:'damage_dealt',label:'💥 DAMAGE',       title:'DAMAGE DEALT',      desc:'合計与ダメージ量',        fmt:fmtNum,  color:'#e06820'},
  {key:'damage_taken',label:'🛡 TANKED',       title:'DAMAGE TAKEN',      desc:'合計被ダメージ量',        fmt:fmtNum,  color:'#902020'},
  {key:'walk',        label:'🚶 WALK',         title:'WALK DISTANCE',     desc:'歩き・走りの累計距離(cm)',fmt:fmtNum,  color:'#4a9a58'},
  {key:'deaths',      label:'💀 DEATHS',       title:'DEATHS',            desc:'総死亡回数',              fmt:fmtNum,  color:'#7858c8'},
  {key:'fish_caught', label:'🎣 FISHING',      title:'FISH CAUGHT',       desc:'魚を釣った回数',          fmt:fmtNum,  color:'#3880b0'},
  {key:'looted',      label:'📦 LOOTED',       title:'CHESTS LOOTED',     desc:'チェストを開けた回数',    fmt:fmtNum,  color:'#c8960a'},
  {key:'levels',      label:'✨ LEVELS',       title:'LEVELS GAINED',     desc:'獲得した合計経験値Lv',    fmt:fmtNum,  color:'#70a830'},
  {key:'total_dist',  label:'🌍 TOTAL DIST',   title:'TOTAL DISTANCE',    desc:'飛行・水泳・歩き全込み',  fmt:fmtDist, color:'#18a888'},
  {key:'fly',         label:'🪂 FLY',          title:'FLY DISTANCE',      desc:'エリトラ等による飛行距離',fmt:fmtDist, color:'#4898d8'},
  {key:'mined',       label:'⛏ MINED',         title:'BLOCKS MINED',      desc:'掘ったブロックの総数',    fmt:fmtNum,  color:'#a06830'},

  {key:'trade',       label:'🪙 TRADES',       title:'TRADE COUNT',       desc:'通貨取引の回数',          fmt:fmtNum,  color:'#c8960a'},
  {key:'furnace',     label:'🔥 FURNACE',      title:'FURNACE USES',      desc:'かまど・精錬装置の操作数',fmt:fmtNum,  color:'#e06020'},
  {key:'sleep',       label:'🛏 SLEEP',        title:'SLEEP COUNT',       desc:'ベッドで寝た回数',        fmt:fmtNum,  color:'#7070d0'},
  {key:'broken',      label:'🪛 BROKEN',       title:'TOOLS BROKEN',      desc:'使い切って壊したアイテム',fmt:fmtNum,  color:'#c04040'},
  {key:'fall',        label:'🫨 FALL',         title:'FALL DISTANCE',     desc:'累計落下距離',            fmt:fmtDist, color:'#c05030'},
  {key:'eff',         label:'⚡ EFFICIENCY',   title:'COMBAT EFFICIENCY', desc:'与ダメ÷被ダメ（高=強）',  fmt:fmtEff,  color:'#40b840'},
  {key:'pvp_death',   label:'🗡 PVP DEATHS',   title:'KILLED BY PLAYER',  desc:'他プレイヤーに倒された数',fmt:fmtNum,  color:'#c04070'},
  {key:'dropped',     label:'📤 DROPPED',      title:'ITEMS DROPPED',     desc:'地面に捨てたアイテム総数',fmt:fmtNum,  color:'#808080'},
];

let current = 0;

function medal(i) {
  const cls = i===0?'r1':i===1?'r2':i===2?'r3':'rN';
  const num = i===0?'1ST':i===1?'2ND':i===2?'3RD':`${i+1}`;
  const sub = i < 3 ? ['GOLD','SLVR','BRNZ'][i] : '';
  return `<div class="rank-badge ${cls}">
    <span class="badge-num">${num}</span>
    ${sub ? `<span class="badge-sub">${sub}</span>` : ''}
  </div>`;
}

function buildTabs() {
  document.getElementById('tabs').innerHTML = categories.map((c,i) =>
    `<button class="tab-btn ${i===current?'active':''}" onclick="sw(${i})">${c.label}</button>`
  ).join('');
}

function buildRanking() {
  const cat = categories[current];
  document.getElementById('rankTitle').textContent = '▶ ' + cat.title;
  document.getElementById('rankDesc').textContent = cat.desc;

  const sorted = [...players].sort((a,b) => b[cat.key]-a[cat.key]);
  const maxVal = sorted[0][cat.key];
  const minVal = sorted[sorted.length-1][cat.key];
  const range  = maxVal - minVal || 1;

  document.getElementById('rankTable').innerHTML = sorted.map((p,i) => {
    const cls = i===0?'r1':i===1?'r2':i===2?'r3':'rN';
    const pct = Math.max(3, Math.round((p[cat.key]-minVal)/range*100));
    return `<div class="rank-row ${cls}" style="animation-delay:${Math.min(i*0.04,0.25)}s">
      ${medal(i)}
      <div class="rank-info">
        <div class="rank-name">${p.name}</div>
        <div class="rank-bar-wrap">
          <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
        </div>
      </div>
      <div class="rank-val">${cat.fmt(p[cat.key])}</div>
    </div>`;
  }).join('');
}

window.sw = function(i){ current=i; document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',j===i)); buildRanking(); };
buildTabs();
buildRanking();
</script>
